services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_agent}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  api:
    build: ./backend
    environment:
      APP_ENV: docker
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ecommerce_agent:change-me-for-local-only@db:5432/ecommerce_agent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      AUTH_MODE: ${AUTH_MODE:-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-session-secret-change-before-production}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123456}
      TASK_EXECUTION_MODE: worker
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on: [db, redis]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
  agent-worker:
    build: ./backend
    command: python -m app.worker
    environment:
      APP_ENV: docker
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ecommerce_agent:change-me-for-local-only@db:5432/ecommerce_agent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_MODE: ${AUTH_MODE:-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-session-secret-change-before-production}
      TASK_EXECUTION_MODE: worker
    depends_on: [db, redis]
  scheduler:
    build: ./backend
    command: python -m app.scheduler
    environment:
      APP_ENV: docker
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ecommerce_agent:change-me-for-local-only@db:5432/ecommerce_agent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on: [db, redis]
volumes:
  postgres_data:
  qdrant_data:
  minio_data:
