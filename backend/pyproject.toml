[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-agent-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "langgraph>=0.2",
  "openai>=1.52",
  "PyJWT[crypto]>=2.10",
  "pwdlib[argon2]>=0.2",
  "alembic>=1.14",
  "huggingface-hub",
  "datasets",
  "openpyxl>=3.1",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "pip-audit>=2.8",
  "setuptools>=83",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests that cross persistence or adapter boundaries",
  "llm: tests that call a configured external LLM provider",
  "e2e_postgres: isolated full-chain tests against a real PostgreSQL server",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
